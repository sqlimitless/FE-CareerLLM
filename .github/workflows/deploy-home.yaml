# Copy to .github/workflows/deploy-home.yaml in BOTH frontend repositories.
name: Deploy home server after frontend push
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    if: vars.HOME_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the backend deployment workflow
        env:
          GH_TOKEN: ${{ secrets.BACKEND_DISPATCH_TOKEN }}
          BACKEND_REPOSITORY: ${{ vars.BACKEND_REPOSITORY }}
        run: |
          gh api --method POST "repos/$BACKEND_REPOSITORY/dispatches" \
            -f event_type=frontend-main-updated
